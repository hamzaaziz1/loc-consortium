# Network addressing for the consortium. Single source of truth.
#
# Format:  compose service | node name | ip | rpc port | metrics port
#
# Besu's static node parser rejects hostnames. An enode URL is expected to
# carry an IP address, because devp2p identifies a peer by its public key and
# treats the address as nothing more than a route to it. Name resolution is
# deliberately outside the protocol.
#
# 172.28 is chosen because docker's default address pools start at 172.17 and
# work upward, so a collision with another project's network is unlikely.
# Validators occupy .11 to .14 and RPC nodes .21 upward, so adding a node of
# either kind does not force a renumber of the other.
#
# The RPC and metrics ports are the HOST ports, all bound to 127.0.0.1. Inside
# the network every node listens on 8545 and 9545.
#
# tools/gen-static-nodes.sh reads this file to build the enode list and the
# compose addressing override, and test/smoke/network.sh reads it to know what
# to probe. Nothing here is written down twice.

SUBNET=172.28.0.0/16

validator-importer  | validator-1.importer-bank | 172.28.0.11 | 8551 | 9551
validator-exporter  | validator-1.exporter-bank | 172.28.0.12 | 8552 | 9552
validator-logistics | validator-1.logistics     | 172.28.0.13 | 8553 | 9553
validator-operator  | validator-1.operator      | 172.28.0.14 | 8554 | 9554
rpc-1               | rpc-1.operator            | 172.28.0.21 | 8545 | 9545
rpc-2               | rpc-2.operator            | 172.28.0.22 | 8546 | 9546
