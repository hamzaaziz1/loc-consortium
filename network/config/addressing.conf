# Fixed IP addresses for the consortium network.
#
# Format:  compose service | node name | ip
#
# Besu's static node parser rejects hostnames. An enode URL is expected to
# carry an IP address, because devp2p identifies a peer by its public key and
# treats the address as nothing more than a route to it. Name resolution is
# deliberately outside the protocol.
#
# 172.28 is chosen because docker's default address pools start at 172.17 and
# work upward, so a collision with another project's network is unlikely.
#
# Validators occupy .11 to .14 and RPC nodes .21 upward. The gap means adding
# a node of either kind does not force a renumber of the other.
#
# This file is the single source of truth. tools/gen-static-nodes.sh reads it
# to build both the enode list and the compose addressing override, so the two
# cannot drift apart.

SUBNET=172.28.0.0/16

validator-importer  | validator-1.importer-bank | 172.28.0.11
validator-exporter  | validator-1.exporter-bank | 172.28.0.12
validator-logistics | validator-1.logistics     | 172.28.0.13
validator-operator  | validator-1.operator      | 172.28.0.14
rpc-1               | rpc-1.operator            | 172.28.0.21
rpc-2               | rpc-2.operator            | 172.28.0.22
