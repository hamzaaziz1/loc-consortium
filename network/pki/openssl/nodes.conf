# End-entity certificates to issue, as data rather than code.
#
# Format:  name | org slug | role | kind
#
#   name      leftmost DNS label, unique within the organisation
#   org slug  must appear in orgs.conf; decides which CA signs it
#   role      recorded in the subject OU, and what the cert-to-role map reads
#   kind      node   = both ends of a connection (devp2p peers dial each other,
#                      so a node is simultaneously server and client)
#             client = connects out only (an application or operator tool
#                      authenticating to an RPC endpoint)
#
# The resulting certificate name is  <name>.<org slug>.loc.consortium, which is
# what each organisation's name constraints permit and nothing else.

# four QBFT validators, one per consortium member
validator-1 | importer-bank | validator | node
validator-1 | exporter-bank | validator | node
validator-1 | logistics     | validator | node
validator-1 | operator      | validator | node

# two non-validator RPC nodes, run by the consortium operator so that
# application traffic never reaches a block producer
rpc-1       | operator      | rpc       | node
rpc-2       | operator      | rpc       | node

# operator services that authenticate to the RPC endpoints
loc-api     | operator      | service   | client
controller  | operator      | service   | client

# one application client per member, issued by that member's own CA
client-1    | importer-bank | client    | client
client-1    | exporter-bank | client    | client
client-1    | logistics     | client    | client
