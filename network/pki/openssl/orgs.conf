# Consortium membership, as data rather than code.
#
# Format:  slug | organisation name
#
# slug is used for directory names, file names and the DNS label in
# certificate names, so it must be lowercase and contain no spaces.
#
# This file is the PKI's view of the membership set. From m4 onward the
# on-chain MemberRegistry is the authoritative view, and this file is what the
# onboarding runbook updates when a membership vote passes.

importer-bank  | Importer Bank
exporter-bank  | Exporter Bank
logistics      | Logistics Operator
operator       | Consortium Operator
