# Six-node QBFT consortium: four validators, two non-validator RPC nodes.
#
# Run from the repository root with: make up
#
# This file contains no IP addresses and no host port bindings. Addressing
# lives in network/config/<env>/addressing.conf and is applied by the
# generated override compose.<env>.yml, so an address is written down once.
#
# Two environments share this file: `local` holds real chain state, `staging`
# is the rehearsal stack where risky operations are tried first. They differ by
# subnet, a +100 port offset, and the compose project name, so a command aimed
# at the wrong one fails rather than quietly touching the live network.
# Chain material paths are selected by LOC_ENV; the PKI is shared.
#
# Design notes that are easy to miss reading the YAML:
#
#   Every RPC endpoint requires mutual TLS. Each node mounts ONLY its own
#   keystore, never the keystore directory: mounting the directory would hand
#   every node every other node's private key and quietly undo the
#   per-organisation separation the whole PKI exists to create.
#
#   The truststore holds the root certificate alone. A trust anchor's own
#   extensions are taken as given rather than checked, so putting the four
#   organisation intermediates in the truststore would mean their
#   nameConstraints were never evaluated and any member could impersonate any
#   other. See ADR 0003.
#
#   Data directories are named volumes, not bind mounts. Besu writes as root
#   inside the container, and a bind mount would leave root-owned files on the
#   host needing sudo to clean up.
#
#   Every JVM is capped at 512 MB, so the stack comes up on a modest laptop.

x-besu-common: &besu-common
  image: ${BESU_IMAGE:-hyperledger/besu:26.8.1}
  restart: unless-stopped
  environment:
    # Besu reads JVM options from BESU_OPTS. Uncapped, each node sizes its heap
    # from host memory and six of them will exhaust an 8 GB machine.
    BESU_OPTS: -Xmx512m
  networks:
    consortium: {}

x-besu-command: &besu-command >-
  --genesis-file=/genesis/genesis.json
  --data-path=/data
  --node-private-key-file=/keys/key.priv
  --static-nodes-file=/config/static-nodes.json
  --p2p-port=30303
  --min-gas-price=0
  --rpc-http-enabled
  --rpc-http-host=0.0.0.0
  --rpc-http-port=8545
  --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,TXPOOL,PERM
  --permissions-nodes-config-file-enabled
  --permissions-accounts-config-file-enabled
  --permissions-nodes-config-file=/perm/permissions.toml
  --permissions-accounts-config-file=/perm/permissions.toml
  --host-allowlist=*
  --rpc-http-tls-enabled
  --rpc-http-tls-keystore-file=/keystores/node.p12
  --rpc-http-tls-keystore-password-file=/keystores/keystore.password
  --rpc-http-tls-client-auth-enabled
  --rpc-http-tls-truststore-file=/keystores/truststore.p12
  --rpc-http-tls-truststore-password-file=/keystores/keystore.password
  --metrics-enabled
  --metrics-host=0.0.0.0
  --metrics-port=9545

# Volume lists are repeated per service rather than shared via an anchor:
# YAML anchors substitute whole values, and Compose does not merge lists, so a
# shared mount list cannot be extended with per-node key material.

services:

  validator-importer:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/${LOC_ENV:-local}/genesis.json:/genesis/genesis.json:ro
      - ../config/${LOC_ENV:-local}/static-nodes.json:/config/static-nodes.json:ro
      - ../pki/out/keystores/truststore.p12:/keystores/truststore.p12:ro
      - ../pki/out/keystores/keystore.password:/keystores/keystore.password:ro
      - ../config/${LOC_ENV:-local}/permissions.toml:/perm/permissions.toml
      - ../keys/${LOC_ENV:-local}/validator-1.importer-bank/key.priv:/keys/key.priv:ro
      - ../pki/out/keystores/validator-1.importer-bank.p12:/keystores/node.p12:ro
      - validator-importer-data:/data

  validator-exporter:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/${LOC_ENV:-local}/genesis.json:/genesis/genesis.json:ro
      - ../config/${LOC_ENV:-local}/static-nodes.json:/config/static-nodes.json:ro
      - ../pki/out/keystores/truststore.p12:/keystores/truststore.p12:ro
      - ../pki/out/keystores/keystore.password:/keystores/keystore.password:ro
      - ../config/${LOC_ENV:-local}/permissions.toml:/perm/permissions.toml
      - ../keys/${LOC_ENV:-local}/validator-1.exporter-bank/key.priv:/keys/key.priv:ro
      - ../pki/out/keystores/validator-1.exporter-bank.p12:/keystores/node.p12:ro
      - validator-exporter-data:/data

  validator-logistics:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/${LOC_ENV:-local}/genesis.json:/genesis/genesis.json:ro
      - ../config/${LOC_ENV:-local}/static-nodes.json:/config/static-nodes.json:ro
      - ../pki/out/keystores/truststore.p12:/keystores/truststore.p12:ro
      - ../pki/out/keystores/keystore.password:/keystores/keystore.password:ro
      - ../config/${LOC_ENV:-local}/permissions.toml:/perm/permissions.toml
      - ../keys/${LOC_ENV:-local}/validator-1.logistics/key.priv:/keys/key.priv:ro
      - ../pki/out/keystores/validator-1.logistics.p12:/keystores/node.p12:ro
      - validator-logistics-data:/data

  validator-operator:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/${LOC_ENV:-local}/genesis.json:/genesis/genesis.json:ro
      - ../config/${LOC_ENV:-local}/static-nodes.json:/config/static-nodes.json:ro
      - ../pki/out/keystores/truststore.p12:/keystores/truststore.p12:ro
      - ../pki/out/keystores/keystore.password:/keystores/keystore.password:ro
      - ../config/${LOC_ENV:-local}/permissions.toml:/perm/permissions.toml
      - ../keys/${LOC_ENV:-local}/validator-1.operator/key.priv:/keys/key.priv:ro
      - ../pki/out/keystores/validator-1.operator.p12:/keystores/node.p12:ro
      - validator-operator-data:/data

  rpc-1:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/${LOC_ENV:-local}/genesis.json:/genesis/genesis.json:ro
      - ../config/${LOC_ENV:-local}/static-nodes.json:/config/static-nodes.json:ro
      - ../pki/out/keystores/truststore.p12:/keystores/truststore.p12:ro
      - ../pki/out/keystores/keystore.password:/keystores/keystore.password:ro
      - ../config/${LOC_ENV:-local}/permissions.toml:/perm/permissions.toml
      - ../keys/${LOC_ENV:-local}/rpc-1.operator/key.priv:/keys/key.priv:ro
      - ../pki/out/keystores/rpc-1.operator.p12:/keystores/node.p12:ro
      - rpc-1-data:/data

  rpc-2:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/${LOC_ENV:-local}/genesis.json:/genesis/genesis.json:ro
      - ../config/${LOC_ENV:-local}/static-nodes.json:/config/static-nodes.json:ro
      - ../pki/out/keystores/truststore.p12:/keystores/truststore.p12:ro
      - ../pki/out/keystores/keystore.password:/keystores/keystore.password:ro
      - ../config/${LOC_ENV:-local}/permissions.toml:/perm/permissions.toml
      - ../keys/${LOC_ENV:-local}/rpc-2.operator/key.priv:/keys/key.priv:ro
      - ../pki/out/keystores/rpc-2.operator.p12:/keystores/node.p12:ro
      - rpc-2-data:/data

  # --- operator tooling proxy ------------------------------------------------
  # Terminates plain HTTP on loopback and speaks mutual TLS to rpc-1, holding
  # the operator's deployer identity.
  #
  # This exists because Foundry cannot present a client certificate. It is not
  # a workaround for the TLS design, it is how operators run tooling against
  # mutually authenticated endpoints in practice: no toolchain carries
  # certificate plumbing for every client, and keeping the deploy key and the
  # network identity in separate places is a property worth having anyway.
  #
  # The alternative, a loopback plaintext RPC port on one node, would be a
  # permanent hole in what m3 established and the first thing a reviewer would
  # notice.
  #
  # Started only when needed:  docker compose --profile ops up -d rpc-proxy
  rpc-proxy:
    image: nginx:1.27-alpine
    profiles: ["ops"]
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../pki/out/operator/issued/deployer/deployer.chain.pem:/certs/client.chain.pem:ro
      - ../pki/out/operator/issued/deployer/deployer.key.pem:/certs/client.key.pem:ro
      - ../pki/out/root/certs/root.cert.pem:/certs/root.pem:ro
    ports:
      # Bound to loopback. Anything reaching this port is already on the host
      # and holds the operator's network identity by proxy, so the binding is
      # the only access control there is.
      # Port differs per environment so the two proxies cannot collide, and so
      # a deployment aimed at the wrong stack fails rather than succeeding
      # against the network holding real state.
      - "127.0.0.1:${PROXY_PORT:-8600}:8600"
    networks:
      consortium: {}

  # --- permissioning controller ----------------------------------------------
  permissioning-controller:
    build: ../../services/permissioning-controller
    profiles: ["ops"]
    restart: unless-stopped
    environment:
      # A plain default, not ${VAR:?...}. The required-variable form makes
      # Compose refuse to interpolate the file at all, so an unset variable
      # blocks every command in the project including `stop` and `down`,
      # not just starting this service. The controller validates it at
      # startup and exits with a clear message, which is where that check
      # belongs.
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS:-}
      NODE_URLS: "https://validator-1.importer-bank.loc.consortium:8545,https://validator-1.exporter-bank.loc.consortium:8545,https://validator-1.logistics.loc.consortium:8545,https://validator-1.operator.loc.consortium:8545,https://rpc-1.operator.loc.consortium:8545,https://rpc-2.operator.loc.consortium:8545"
      # Left unset deliberately. The controller reads static-nodes.json, which
      # is the authoritative list of every node in the network. Setting this
      # overrides that, and setting it WRONG removes nodes from their own
      # network, so the default should not depend on anyone remembering to
      # export a shell variable.
      INFRASTRUCTURE_ENODES: ${INFRASTRUCTURE_ENODES:-}
      STATIC_NODES_FILE: /config/static-nodes.json
      INFRASTRUCTURE_ACCOUNTS: ${INFRASTRUCTURE_ACCOUNTS:-}
      INTERVAL_MS: ${CONTROLLER_INTERVAL_MS:-10000}
      HEARTBEAT_FILE: /perm/state/heartbeat.json
      METRICS_PORT: "9600"
    volumes:
      - ../config/${LOC_ENV:-local}/permissions.toml:/perm/permissions.toml
      - ../config/${LOC_ENV:-local}/controller:/perm/state
      - ../config/${LOC_ENV:-local}/static-nodes.json:/config/static-nodes.json:ro
      - ../pki/out/operator/issued/controller/controller.chain.pem:/certs/client.chain.pem:ro
      - ../pki/out/operator/issued/controller/controller.key.pem:/certs/client.key.pem:ro
      - ../pki/out/root/certs/root.cert.pem:/certs/root.pem:ro
    networks:
      consortium: {}

  # --- observability -----------------------------------------------------------
  # In the ops profile so `make up` stays at the six-node memory budget set in
  # m2. Observability is opt-in rather than always running.

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["ops"]
    restart: unless-stopped
    environment:
      LOC_ENV: ${LOC_ENV:-local}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Enough to see a week of certificate expiry trend and a stall; this is a
      # development stack, not a long-term metrics store.
      - --web.enable-lifecycle
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      consortium: {}

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["ops"]
    restart: unless-stopped
    environment:
      # Anonymous admin access, bound to loopback. This is a local development
      # dashboard; adding credentials here would be security theatre, and the
      # port binding is the actual control.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      consortium: {}

  # Serves the certificate expiry textfile written by
  # tools/cert-expiry-metrics.sh. A static file server rather than an exporter,
  # because reading expiry needs filesystem access to the private CA and
  # mounting that into a long-running network service would be the wrong trade.
  cert-metrics:
    image: nginx:1.27-alpine
    profiles: ["ops"]
    restart: unless-stopped
    volumes:
      - ../../observability/textfile:/usr/share/nginx/html/metrics:ro
      - ../../observability/cert-metrics.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      consortium: {}

networks:
  consortium:
    name: loc-${LOC_ENV:-local}

volumes:
  prometheus-data:
  grafana-data:
  validator-importer-data:
  validator-exporter-data:
  validator-logistics-data:
  validator-operator-data:
  rpc-1-data:
  rpc-2-data:
