# Six-node QBFT consortium: four validators, two non-validator RPC nodes.
#
# Run from the repository root with: make up
#
# This file deliberately contains no IP addresses. Addressing lives in
# network/config/addressing.conf and is applied by the generated override
# compose.addressing.yml, so the address a node is given and the address its
# peers dial come from one source and cannot drift.
#
# Other design notes that are easy to miss reading the YAML:
#
#   Data directories are named volumes, not bind mounts. Besu writes as root
#   inside the container, and a bind mount would leave root-owned files on the
#   host needing sudo to clean up.
#
#   Every JVM is capped at 512 MB. Six nodes plus metrics fit in 8 GB, so the
#   stack comes up on a modest laptop rather than only on a large one.
#
#   RPC on the validators is published to 127.0.0.1 for debugging only. A
#   production deployment exposes no RPC on a block producer; application
#   traffic belongs on the two RPC nodes.

x-besu-common: &besu-common
  image: ${BESU_IMAGE:-hyperledger/besu:26.8.1}
  restart: unless-stopped
  environment:
    # Besu reads JVM options from BESU_OPTS. Uncapped, each node sizes its heap
    # from host memory and six of them will exhaust an 8 GB machine.
    BESU_OPTS: -Xmx512m
  networks:
    consortium: {}

x-besu-command: &besu-command >-
  --genesis-file=/genesis/genesis.json
  --data-path=/data
  --node-private-key-file=/keys/key.priv
  --static-nodes-file=/config/static-nodes.json
  --p2p-port=30303
  --min-gas-price=0
  --rpc-http-enabled
  --rpc-http-host=0.0.0.0
  --rpc-http-port=8545
  --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,TXPOOL
  --host-allowlist=*
  --metrics-enabled
  --metrics-host=0.0.0.0
  --metrics-port=9545

services:

  validator-importer:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/genesis.json:/genesis/genesis.json:ro
      - ../config/static-nodes.json:/config/static-nodes.json:ro
      - ../keys/validator-1.importer-bank/key.priv:/keys/key.priv:ro
      - validator-importer-data:/data
    ports:
      - "127.0.0.1:8551:8545"
      - "127.0.0.1:9551:9545"

  validator-exporter:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/genesis.json:/genesis/genesis.json:ro
      - ../config/static-nodes.json:/config/static-nodes.json:ro
      - ../keys/validator-1.exporter-bank/key.priv:/keys/key.priv:ro
      - validator-exporter-data:/data
    ports:
      - "127.0.0.1:8552:8545"
      - "127.0.0.1:9552:9545"

  validator-logistics:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/genesis.json:/genesis/genesis.json:ro
      - ../config/static-nodes.json:/config/static-nodes.json:ro
      - ../keys/validator-1.logistics/key.priv:/keys/key.priv:ro
      - validator-logistics-data:/data
    ports:
      - "127.0.0.1:8553:8545"
      - "127.0.0.1:9553:9545"

  validator-operator:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/genesis.json:/genesis/genesis.json:ro
      - ../config/static-nodes.json:/config/static-nodes.json:ro
      - ../keys/validator-1.operator/key.priv:/keys/key.priv:ro
      - validator-operator-data:/data
    ports:
      - "127.0.0.1:8554:8545"
      - "127.0.0.1:9554:9545"

  rpc-1:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/genesis.json:/genesis/genesis.json:ro
      - ../config/static-nodes.json:/config/static-nodes.json:ro
      - ../keys/rpc-1.operator/key.priv:/keys/key.priv:ro
      - rpc-1-data:/data
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:9545:9545"

  rpc-2:
    <<: *besu-common
    command: *besu-command
    volumes:
      - ../genesis/genesis.json:/genesis/genesis.json:ro
      - ../config/static-nodes.json:/config/static-nodes.json:ro
      - ../keys/rpc-2.operator/key.priv:/keys/key.priv:ro
      - rpc-2-data:/data
    ports:
      - "127.0.0.1:8546:8545"
      - "127.0.0.1:9546:9545"

networks:
  consortium:
    name: loc-consortium

volumes:
  validator-importer-data:
  validator-exporter-data:
  validator-logistics-data:
  validator-operator-data:
  rpc-1-data:
  rpc-2-data:
