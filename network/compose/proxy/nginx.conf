# Plain HTTP on loopback in, mutual TLS to the consortium out.
#
# A stream proxy rather than an HTTP proxy: JSON-RPC is request/response over
# a TCP connection and nothing here needs to parse or rewrite HTTP. Proxying
# at layer 4 keeps the component small enough to reason about, which matters
# for something holding an operator certificate.

user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

stream {
    # Docker's embedded resolver. Without it nginx caches the upstream address
    # at startup and a node restart leaves the proxy pointing at a stale IP.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 8600;

        set $upstream rpc-1.operator.loc.consortium:8545;
        proxy_pass $upstream;

        proxy_ssl on;

        # The operator's deployer identity. The chain rather than the bare
        # certificate: the node trusts only the root, so the issuing
        # intermediate has to come from this side for a path to exist.
        proxy_ssl_certificate     /certs/client.chain.pem;
        proxy_ssl_certificate_key /certs/client.key.pem;

        # Verify the node's certificate against the consortium root. Without
        # this the proxy would authenticate itself to anything that answered
        # the address, which would defeat half the point of mutual TLS.
        proxy_ssl_trusted_certificate /certs/root.pem;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 3;

        # Check the name as well as the chain. The certificate asserts this
        # name; a valid certificate for a different node is still the wrong
        # node.
        proxy_ssl_name        rpc-1.operator.loc.consortium;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_timeout 60s;
    }
}
