# Serves the certificate expiry textfile.
#
# The default_type matters: nginx does not know the .prom extension and would
# otherwise serve it as application/octet-stream. Prometheus 3.x refuses to
# parse a content type it does not recognise, and the scrape fails with
# "received unsupported Content-Type" while the file is perfectly readable.
# Prometheus 2.x guessed; 3.x does not.
server {
    listen 80;
    location /metrics/ {
        alias /usr/share/nginx/html/metrics/;
        default_type "text/plain; version=0.0.4";
        autoindex off;
    }
}
