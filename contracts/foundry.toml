[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
verbosity = 2

[profile.default.fuzz]
runs = 512

[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 4096

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true